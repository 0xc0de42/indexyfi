[project]
name = "ind-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ind-cmc", "ind-core", "ind-config", "ind-logger", "ind-atlas", "ind-assets", "ind-snapshot", "ind-history", "aiohttp>=3.11,<4", "returns>=0.24,<1"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
ind-core = { workspace = true }
ind-config = { workspace = true }
ind-logger = { workspace = true }
ind-atlas = { workspace = true }
ind-assets = { workspace = true }
ind-snapshot = { workspace = true }
ind-history = { workspace = true }
ind-cmc = { workspace = true }
