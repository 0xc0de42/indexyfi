[project]
name = "indexfi-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = ["mypy>=1.13,<2", "ruff>=0.9,<1", "pytest>=8,<10"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
plugins = ["returns.contrib.mypy.returns_plugin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests", "services/server/tests"]
